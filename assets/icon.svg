<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d36"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.2" stop-color="#ff9500"/>
      <stop offset="0.4" stop-color="#ffd60a"/>
      <stop offset="0.6" stop-color="#34c759"/>
      <stop offset="0.8" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f27"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- light spill from the strip -->
  <rect x="232" y="660" width="560" height="56" rx="28" fill="url(#strip)" filter="url(#glow)" opacity="0.9"/>
  <!-- monitor -->
  <rect x="212" y="262" width="600" height="380" rx="34" fill="#3a3e4a"/>
  <rect x="234" y="284" width="556" height="336" rx="18" fill="url(#screen)"/>
  <path d="M470 642 h84 l22 70 h-128 z" fill="#2f323c"/>
  <!-- LED strip -->
  <rect x="262" y="726" width="500" height="26" rx="13" fill="url(#strip)"/>
</svg>
