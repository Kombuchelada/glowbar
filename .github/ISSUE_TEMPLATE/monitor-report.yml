name: Monitor compatibility report
description: Tell us whether Glowbar works with your monitor
title: "[Compatibility] <monitor model>"
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Monitor model
      placeholder: AORUS FO32U2P
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Output of `glowbar info`
      description: Run `/Applications/Glowbar.app/Contents/Resources/glowbar info` with the monitor's USB upstream cable connected. It only reads from the monitor.
      render: text
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it work?
      options:
        - All effects work
        - Some effects work
        - Nothing happens
        - The app says the firmware isn't supported
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Which effects misbehave, your macOS version, Mac model, how the monitor is connected (USB-C, USB-B, dock, KVM).
